[project]
name = "aegis-agent"
version = "0.1.0"
description = "Aegis Agent - Orchestration Runtime, State Machine & Tool Execution Host"
readme = "README.md"
requires-python = ">=3.11"
# 依赖基线：版本下限与 uv.lock 实际锁定版本严格对齐（解决声明值与锁定值漂移）。
# 升级依赖必须显式执行 `uv lock --upgrade-package <name>` 并同步修订本清单。
dependencies = [
    # 1. Agent Runtime 核心编排与模型接入
    "langgraph>=1.2.11,<2.0.0",
    "openai>=3.14.0,<4.0.0",
    "pydantic>=2.13.5,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "tiktoken>=0.14.0,<1.0.0",
    "tenacity>=9.1.4,<10.0.0",

    # 2. 关系数据库与状态快照持久化
    "aiosqlite>=0.22.1,<1.0.0",
    # 说明：LangGraph 断点续跑所需的 AsyncSqliteSaver 位于独立包
    # `langgraph-checkpoint-sqlite`（当前 lock 中不存在，故此处不声明）。
    # 实现 workflow.py 的 Checkpointing 时执行：
    #   uv add "langgraph-checkpoint-sqlite"

    # 3. 异步网络客户端 (用于调用远端 RAG/Web 服务)
    "httpx>=0.28.1,<1.0.0",

    # 4. Web 搜索与正文清洗 (Agent 工具层)
    "duckduckgo-search>=8.1.1,<9.0.0",
    "trafilatura>=2.2.0,<3.0.0",
    "tavily-python>=0.8.3,<1.0.0",

    # 5. 可观测性与追踪
    "loguru>=0.7.3,<1.0.0",
    "langfuse>=4.15.2,<5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "numpy>=2.4.6,<3.0.0",
    "tabulate>=0.10.0,<1.0.0",
    "hatchling>=1.32.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime", "src/tool_layer", "src/evaluation", "src/mcps", "src/services", "src/skills"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
