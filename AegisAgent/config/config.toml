# ==============================================================================
# Aegis 系统全局配置文件 (config/config.toml)
#
# 架构原则：
# 1. 业务参数、物理配额、多模型降级列表放于本文件（可入 Git 版本库）
# 2. 敏感 API Key 统一由 .env 提供，本文件仅引用环境变量名 (api_key_env)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 运行时物理安全守卫 (Guardrails & Budgets)
# ------------------------------------------------------------------------------
[runtime.guardrails]
max_steps = 25                  # 单任务最大执行步数上限
max_total_tokens = 200000       # 单任务累计消耗 Token 物理上限 (确定性指标，替代外部计费)
max_wall_time_sec = 900         # 单任务总物理运行时间上限 (秒，默认 15 分钟)
consecutive_errors_limit = 3    # 连续工具报错熔断阈值 (无论参数怎么微调，连续报错 3 次即触发重规划)
identical_fingerprint_limit = 3 # 相同参数 MD5 哈希连续出现次数上限 (防死循环原地打转)

# ------------------------------------------------------------------------------
# 2. API 弹性重试策略 (Retry Policy)
# ------------------------------------------------------------------------------
[runtime.retry]
max_retries = 3                 # 遭遇网络超时、429 限流或 5xx 时的最大指数退避重试次数
backoff_factor = 2.0            # 指数退避倍数因子 (秒)

# ------------------------------------------------------------------------------
# 3. 三层金字塔上下文治理 (Context Trimming & Pruning)
# ------------------------------------------------------------------------------
[runtime.context]
session_token_limit = 32000         # 单会话活跃对话物理 Token 预算硬上限
compaction_high_watermark = 0.80    # 高水位触发线 (达到 80% 启动滚动压缩)
compaction_ratio = 0.40             # 目标压缩基准线 (对齐切出最古老约 40% 对话进行提炼)
active_window_turns = 3             # 保底保留的最少活跃对话轮数 (Atomic Pair 成对裁剪)
compaction_trigger_turns = 8        # 轮数保底触发阈值
max_observation_tokens = 1500       # 单次工具输出触发本地落盘截断的 Token 阈值
observation_head_lines = 20         # 截断时保留的头部关键行数
observation_tail_lines = 30         # 截断时保留的尾部关键行数

# ------------------------------------------------------------------------------
# 4. 本地存储与持久化路径 (Storage Paths)
# ------------------------------------------------------------------------------
[runtime.storage]
checkpoint_db_path = "storage/checkpoints/aegis_state.db"
metadata_db_path = "storage/aegis_meta.db"
traces_dir = "storage/traces"
artifacts_dir = "storage/artifacts"

# ------------------------------------------------------------------------------
# 5. 思考模型配置与降级列表 (Reasoning Model Fallback Chain)
#    用于：Planner 宏观规划、阶段重规划、深度架构分析、最终技术报告撰写
# ------------------------------------------------------------------------------
[models.reasoning]
temperature = 0.0               # 严谨确定性推理，温度设为 0.0

[[models.reasoning.endpoints]]
name = "deepseek-r1-primary"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-reasoner"
api_key_env = "DEEPSEEK_API_KEY"
timeout_sec = 120

[[models.reasoning.endpoints]]
name = "siliconflow-r1-backup"
base_url = "https://api.siliconflow.cn/v1"
model = "deepseek-ai/DeepSeek-R1"
api_key_env = "SILICONFLOW_API_KEY"
timeout_sec = 120

# ------------------------------------------------------------------------------
# 6. 快速模型配置与降级列表 (Fast / Action Model Fallback Chain)
#    用于：微观 ReAct 循环 (Executor 工具选择与参数生成)、中间阶段摘要压缩
# ------------------------------------------------------------------------------
[models.fast]
temperature = 0.2               # 快速工具调度，保持输出格式稳定

[[models.fast.endpoints]]
name = "deepseek-v3-primary"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
api_key_env = "DEEPSEEK_API_KEY"
timeout_sec = 30

[[models.fast.endpoints]]
name = "openai-4o-mini-backup"
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"
api_key_env = "OPENAI_API_KEY"
timeout_sec = 30

[[models.fast.endpoints]]
name = "local-ollama-fallback"
base_url = "http://localhost:11434/v1"
model = "qwen2.5:7b"
api_key_env = "OLLAMA_API_KEY"
timeout_sec = 60

# ------------------------------------------------------------------------------
# 7. 基础设施独立微服务客户端寻址
# ------------------------------------------------------------------------------
[services]
rag_url = "http://127.0.0.1:8001"
shell_url = "http://127.0.0.1:8002"
web_url = "http://127.0.0.1:8003"
timeout_sec = 60

# ------------------------------------------------------------------------------
# 8. Agent HTTP API 接入层 (唯一用户入口)
#    契约：documents/agent_runtime/11_http_api.md
# ------------------------------------------------------------------------------
[server]
host = "127.0.0.1"                  # 安全红线：严禁改为 0.0.0.0（工具链含命令执行能力）
port = 8000
max_concurrent_tasks = 1            # 单机串行化资源治理，超出返回 429
cors_allow_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
sse_heartbeat_sec = 15
sse_buffer_events = 1000
artifact_preview_chars = 200

# ------------------------------------------------------------------------------
# 9. MCP (Model Context Protocol) 外部扩展服务器
#    规范：documents/agent_runtime/09_mcp_integration_and_governance.md
#    说明：MCP 会拉起外部子进程，因此所有 server 默认 enabled = false，须显式开启。
#          敏感凭据一律以 "env:XXX" 形式引用 .env，禁止明文写入本文件。
# ------------------------------------------------------------------------------
[mcp]
enabled = true                      # 总开关（关闭后忽略全部 servers）
connection_timeout_sec = 30
call_timeout_sec = 60
max_description_chars = 1000         # 数据面治理：工具描述长度上限
reject_on_injection = true           # 数据面治理：描述命中注入样态时拒绝注册该工具
rlimit_as_mb = 1024                  # 控制面治理：stdio 子进程 RLIMIT_AS 上限
rlimit_fsize_mb = 50                 # 控制面治理：stdlib 子进程 RLIMIT_FSIZE 上限
rlimit_cpu_sec = 300                 # 控制面治理：stdio 子进程 RLIMIT_CPU 上限

# 本地 stdio 模式服务器（示例：路径按实际工作区填写后再启用）
[mcp.servers.filesystem]
enabled = false
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "<ABSOLUTE_WORKSPACE_PATH>"]
env = {}

# 带敏感 Token 的 stdio 服务器（凭据引用自 .env）
[mcp.servers.github]
enabled = false
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "env:GITHUB_TOKEN" }

# 远程 HTTP/SSE 模式服务器
[mcp.servers.remote_doc]
enabled = false
transport = "sse"
url = "http://127.0.0.1:8005/sse"
env = {}

# ------------------------------------------------------------------------------
# 10. bash_shell 子系统（同工程独立进程 :8002）
#     规范：documents/技术选型/bash_shell.md
#     注意：本段由子系统自行读取，不经过 agent_runtime.config，保持 sidecar 边界
# ------------------------------------------------------------------------------
[bash_shell]
host = "127.0.0.1"
port = 8002
timeout_sec = 60                    # 单命令默认硬超时（秒）
sigterm_grace_sec = 2               # SIGTERM -> SIGKILL 之间的宽限期（秒）
rlimit_as_mb = 2048                 # RLIMIT_AS 虚拟内存上限
rlimit_fsize_mb = 50                # RLIMIT_FSIZE 单文件大小上限
rlimit_cpu_sec = 300                # RLIMIT_CPU 纯 CPU 时间上限
memory_pool_mb = 8192               # 全局内存池总量（并发配额）
max_concurrent = 4                  # 并发执行上限
artifacts_dir = "storage/artifacts" # 全量日志离线落盘根目录

# ------------------------------------------------------------------------------
# 11. web_search 子系统（同工程独立进程 :8003）
#     规范：documents/技术选型/web_search.md
# ------------------------------------------------------------------------------
[web_search]
host = "127.0.0.1"
port = 8003
provider = "ddg"                    # 搜索源："ddg"（开箱即用免 Key 检索）
max_results = 8                     # 单次搜索返回候选条数
fetch_concurrency = 5               # 并发抓取页数
request_timeout_sec = 10            # 单页抓取超时（秒）
total_timeout_sec = 30              # 单次检索总超时（秒）
max_content_tokens = 1500           # 正文超过该 Token 数则落盘，只回精炼摘要
preview_chars = 200                 # 摘要保留的头部字符数
user_agent = "Mozilla/5.0 (compatible; AegisBot/0.1)"
artifacts_dir = "storage/artifacts" # 长正文离线落盘根目录

# ------------------------------------------------------------------------------
# 12. 研究子智能体（外部不可信数据隔离区）
#     规范：documents/agent_runtime/12_research_subagent.md
#     作用：主 Agent 不接触任何原始网页，只接收强类型校验后的研究报告
# ------------------------------------------------------------------------------
[research]
enabled = true                      # 关闭后主 Agent 完全丧失外部信息能力（最安全）
model_tier = "fast"                 # 使用便宜快速的层级
max_rounds = 3                      # 内部检索轮数上限
max_sources = 5                     # 单轮最多来源数
max_source_chars = 6000             # 单源正文进入子上下文的截断上限
max_wall_time_sec = 45              # 子智能体挂钟上限（秒）
max_total_tokens = 20000            # 子智能体 Token 上限
max_findings = 8                    # 结论条目上限
max_answer_chars = 500              # 单条结论长度上限
max_code_examples = 5               # 代码示例条数上限
max_code_chars = 2000               # 单个代码块长度上限
max_report_chars = 4000             # 渲染后注入主上下文的上限


# ------------------------------------------------------------------------------
# 13. 技能信任与治理（工作区技能包是不可信来源）
#     规范：documents/agent_runtime/08_skills_management.md 第 4.1-4.3 节
#     说明：技能内容会进入系统提示词，信任位置高于工具输出，因此按来源分级，
#           工作区覆盖默认拒绝——克隆一个恶意仓库即可注入，必须显式授权。
# ------------------------------------------------------------------------------
[skills]
allow_builtin = true                # 内置技能包（随发行版交付，可信）
allow_global = true                 # 用户全局技能库 ~/.aegis/skills（用户自己的，可信）
allow_workspace = false             # 工作区覆盖 <repo>/.aegis/skills（不可信，默认拒绝）
max_description_chars = 200         # 清单中单条描述的长度上限
max_triggers = 12                   # 单技能触发词条数上限
high_privilege_tools = ["bash", "write_file"]   # 高风险工具名单（用于标注，不用于拦截）